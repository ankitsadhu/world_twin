  html, body { margin: 0; height: 100%; background: #07070b; color: var(--ink); font: var(--t-body)/1.4 var(--font); overflow: hidden; }

  #hud { position: fixed; top: var(--s4); left: var(--s4); z-index: 12; }
  #districtbtn { display: inline-flex; align-items: center; gap: var(--s1); font-size: var(--t-headline); font-weight: var(--w-semibold); padding: 0 var(--s4); min-height: var(--hit); border-radius: var(--r-control); }
  #menu { position: absolute; top: 52px; left: 0; width: 260px; padding: var(--s2); }
  #menu[hidden] { display: none; }
  #menu .item { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: var(--hit); padding: 0 var(--s3);
    background: none; border: none; border-radius: var(--r-control); color: var(--ink); font: var(--t-body) var(--font); cursor: pointer; }
  #menu .item:hover { background: var(--fill); }
  #menu .sep { height: 1px; background: var(--glass-border); margin: var(--s2) var(--s2); }

    border-radius: var(--r-control); cursor: pointer; position: relative; }
  .dockbtn:hover { background: var(--fill); }
  .dockbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  #soundbtn[aria-pressed="true"] { background: none; color: inherit; }   /* sound is a setting, not a mode: the icon shows it */
  .dockbtn span { position: absolute; right: 52px; white-space: nowrap; background: var(--glass-strong); color: var(--ink); padding: var(--s1) var(--s2);
    border-radius: 8px; font-size: var(--t-caption); opacity: 0; pointer-events: none; transition: opacity .15s; }
  .dockbtn:hover span, .dockbtn:focus-visible span { opacity: 1; }
  .dockbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #dock .sep { height: 1px; background: var(--glass-border); margin: var(--s1) var(--s2); }
  .dockbtn em { display: none; font: var(--w-semibold) 10px var(--font); font-style: normal; margin-top: 2px; }
  body[data-input="touch"] [data-t] { display: none !important; }              /* touch rotates with two fingers */
  #loading { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(120% 80% at 50% 30%, #2a1630 0%, #0b0b12 60%, #050508 100%); color: var(--ink); font-family: var(--font);
    transition: opacity .9s ease; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #loading h1 { font-size: 40px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 6px; }
  #loading p { color: var(--ink-2); margin: 0 0 28px; font-size: var(--t-body); }
  #bar { width: 220px; height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  body.loading #hud, body.loading #where, body.loading #minimap, body.loading #dock, body.loading #bizbtn, body.loading #zoom { visibility: hidden; }
  /* + / − sit just above the control dock (bottom bar on phones) */
  #zoom { position: fixed; right: var(--s4); z-index: 12; display: flex; flex-direction: column; padding: var(--s1); gap: 2px; }
  @media (max-width: 640px) { #zoom { right: var(--s3); } }
  #minimap { position: fixed; left: var(--s4); bottom: var(--s4); width: 200px; height: 200px; border-radius: 50%;
             border: 1.5px solid rgba(255,255,255,.35); box-shadow: var(--shadow); cursor: pointer; z-index: 5; }

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
import { MapControls } from "three/addons/controls/MapControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { Collider } from "./js/collision.js";
import { Crowd, tktsSeats } from "./js/crowd.js";
import { Navigator } from "./js/nav.js";
import { CityMap, drawPlaceIcon, drawBadge, pinColor } from "./js/map.js";
import { PAINTS } from "./js/bike.js";
import { StreetWalk } from "./js/walk.js";
import { Business } from "./js/business.js";
import { ICON } from "./js/icons.js";
import { optimizeChunk } from "./js/optimize.js";
import { Screens } from "./js/screens.js";
import { CityAudio } from "./js/audio.js";
import { Ride } from "./js/ride.js";
import { Traffic } from "./js/traffic.js";
import { Pursuit } from "./js/pursuit.js";
import { Settings, Progress, PauseMenu } from "./js/settings.js";
import { Pad, BTN, navigateFocus, prompt } from "./js/gamepad.js";
import { caption } from "./js/captions.js";
import { Messages } from "./js/messages.js";
import { makeScreenViews } from "./js/screenview.js";
import { Flight, BANNER_SLOT } from "./js/flight.js";
import { Boat, BOAT_SLOT } from "./js/boat.js";
import { Helm } from "./js/helm.js";
import { Harbor } from "./js/harbor.js";
import { GroundMap } from "./js/groundmap.js";
import { IntrepidVisit } from "./js/intrepid.js";
import { Trip } from "./js/trip.js";
import { Avatar, Npcs, PLAYER, PLAYER_OUTFITS, npcPool } from "./js/avatar.js";
import { Fares } from "./js/fares.js";
import { applyStorefronts } from "./js/storefront4.js";
import { Tours } from "./js/tours.js";
import { Plan } from "./js/plan.js";
document.querySelectorAll("[data-icon]").forEach(el => el.outerHTML = ICON[el.dataset.icon]);

const ROOT = "../";
// Blender (Z-up, metres) -> three (Y-up): (x, y, z) -> (x, z, -y)
const B = (x, y, z) => new THREE.Vector3(x, z, -y);

// ---------------------------------------------------------------- renderer / scene
// no WebGL (very old browser / blocked GPU): say so plainly instead of a blank page
if (!document.createElement("canvas").getContext("webgl2")) {
  document.getElementById("loadtxt").textContent = "This browser can't show 3D. Try the latest Chrome, Safari, Edge or Firefox.";
  throw new Error("WebGL2 unavailable");
}
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 16000);   // far enough for the Statue from Midtown (9 km)
scene.fog = new THREE.FogExp2(0x0b0a14, 0.00012);

// sky dome: gradient by time of day (matches the Blender lookdev camera sky). Colours are linear and go through AgX +
// sRGB in the output pass, which lightens and desaturates them a lot: they're set deep on purpose so the sky reads blue,
// and the blue starts ~25 degrees up (most of the sky you see from the street or a plane is near the horizon)
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { top: { value: new THREE.Color() }, horizon: { value: new THREE.Color() } },
  vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }",
  fragmentShader: "uniform vec3 top; uniform vec3 horizon; varying vec3 vP; void main(){ float t = clamp(vP.y*2.2,0.,1.); gl_FragColor = vec4(mix(horizon, top, pow(t,.55)),1.); }",
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(6000, 32, 16), skyMat);
sky.renderOrder = -10;                                         // drawn first, writes no depth: anything farther still shows
scene.add(sky);
// the river reaches the horizon: the Hudson's own water material on a wide disc that follows the camera (replacing the
// district's water mesh, so there's no seam where the model ends), fading into the horizon haze far out. From a plane,
// a boat or a tower the edge of the model never shows as a void or a line on the water.
const worldWater = new THREE.Mesh(new THREE.CircleGeometry(14000, 128).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x213538, roughness: 0.06 }));
worldWater.position.y = -1.8; worldWater.raycast = () => {}; worldWater.name = "WORLD_water";
scene.add(worldWater);
function horizonFade(mat) {                      // mix toward the horizon colour with distance (on top of the fog)
  mat.onBeforeCompile = sh => {
    sh.uniforms.uHorizon = skyMat.uniforms.horizon; sh.uniforms.uEye = { value: camera.position };
    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vWorldW;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvWorldW = (modelMatrix * vec4(transformed, 1.0)).xyz;");
    sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nuniform vec3 uHorizon; uniform vec3 uEye; varying vec3 vWorldW;")
      .replace("#include <fog_fragment>", "#include <fog_fragment>\n  float dW = length(vWorldW.xz - uEye.xz);\n  gl_FragColor.rgb = mix(gl_FragColor.rgb, uHorizon, smoothstep(900., 11000., dW + uEye.y * 1.5));");
  };
  mat.customProgramCacheKey = () => "horizon-fade";
  mat.needsUpdate = true;
}
horizonFade(worldWater.material);
// once the district loads: the world water takes the Hudson's exact material and the district's own water mesh hides
function adoptWater(root) {
  root.traverse(o => {
    if (!o.isMesh || o.material?.name !== "M_Water_Hudson" || o === worldWater) return;
    const m = o.material.clone(); m.name = "M_Water_World"; horizonFade(m);
    worldWater.material = m; o.visible = false;
  });
}
// the river reflects the real sky (its gradient at this time of day), re-shot when the light changes. A single cube
// shot can't place the city's reflections correctly (it shows hard seams), and a true mirror would render the whole
// city twice per frame, so the water mirrors the sky only, never the street photo the rest of the scene is lit by.
const waterCube = new THREE.WebGLCubeRenderTarget(128, { type: THREE.HalfFloatType });
const waterCubeCam = new THREE.CubeCamera(1, 7000, waterCube);
const skyOnly = new THREE.Scene();
let waterReflTod = -1, waterReflTex = null;
function captureWaterReflection(force) {
  if (!worldWater.material || (!force && Math.abs(curTod - waterReflTod) < 0.04)) return;
  waterReflTod = curTod;
  const parent = sky.parent, skyAt = sky.position.clone();
  skyOnly.add(sky); sky.position.set(0, 0, 0); waterCubeCam.position.set(0, 0, 0);
  waterCubeCam.update(renderer, skyOnly);
  parent.add(sky); sky.position.copy(skyAt);
  const t = pmrem.fromCubemap(waterCube.texture).texture;
  waterReflTex?.dispose(); waterReflTex = t;
  const m = worldWater.material, night = smooth(0.45, 0.8, curTod);
  // a lightly rippled river with a strong sky sheen at low angles: the real sky at this hour (never the lighting photo,
  // whose street and waterfront would show up in the open harbour), dark water after dusk
  m.envMap = t;
  m.envMapIntensity = 2.2 - 1.6 * night; m.roughness = 0.1 - 0.04 * night;
  m.color.set(0x2a4148).lerp(new THREE.Color(0x070b10), night); m.needsUpdate = true;
}

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(300, 600, 200);
scene.add(sun);
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x3a3a40, 0.6);
scene.add(hemi);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.35, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// environment lighting from the same HDRIs used in Blender
const pmrem = new THREE.PMREMGenerator(renderer);
const env = {};
const rgbe = new RGBELoader();
function loadEnv(key, file) {
  return new Promise(res => rgbe.load(ROOT + "blender/library/hdri/" + file, t => {
    env[key] = pmrem.fromEquirectangular(t).texture; t.dispose(); res();
  }, undefined, () => res()));
}

// ---------------------------------------------------------------- day / night (mirrors NG_TOD in Blender)
// exported emissive strength = the NIGHT value; daytime ratio per material family:
const DAY_RATIO = [
  [/^MAT_SLOT_/, 7.0 / 2.2], [/^M_LED_/, 7.0 / 2.2],
  [/^M_Glass_Curtain|^M_Facade_/, 0.0], [/^M_Storefront|^M_ShopSign/, 0.35 / 1.8],
  [/^M_Light_StreetWarm/, 0.0], [/^M_Light_StoreSign/, 0.3], [/^M_Light_Signal/, 8 / 12],
  [/^M_Light_WalkHand/, 5 / 8], [/^M_Light_SubwayGreen/, 1 / 6], [/^M_Light_Headlight/, 0.05],
  [/^M_Light_Taillight/, 0.1], [/^M_Light_TaxiTop/, 0.3], [/^M_Light_Turn/, 0.15], [/^M_Glass_TKTSRed/, 0.14],
  [/^M_Light_BoatCabin/, 0.0],
  [/^M_Light_ShipBridge/, 0.0], [/^M_Light_LibertyFlood/, 0.0], [/^M_Light_LibertyTorch/, 0.05], [/^M_Light_WTCBeacon/, 0.3],   // floodlit / lit after dark                                     // the sightseeing boat's saloon windows: lit only at night
];
const emissives = [];
function registerMaterial(m) {
  if (!m || m.userData._reg) return;
  m.userData._reg = true;
  if (/^M_Car_Paint_TaxiYellow/.test(m.name)) {     // AgX + a full clear-coat wash cab yellow out to cream: deepen it
    m.color.setRGB(0.62, 0.38, 0.0); if ("clearcoat" in m) m.clearcoat = 0.4;
  }
  if (m.name === "M_Road_Asphalt") m.color.setRGB(0.5, 0.5, 0.52);   // NYC asphalt is dark (albedo ~0.1): streets must read against the pale sidewalks, even from the air
  if (m.emissive && (m.emissive.r + m.emissive.g + m.emissive.b > 0 || m.emissiveMap)) {
    const rule = DAY_RATIO.find(([re]) => re.test(m.name));
    // Blender strengths are tuned for EEVEE+AgX; three.js needs a lower scale per family
    const k = /^MAT_SLOT_|^M_LED_/.test(m.name) ? 0.55 : /^M_Light_/.test(m.name) ? 0.35 : 0.7;
    const night = m.emissiveIntensity * k;
    emissives.push({ m, night, day: night * (rule ? Math.min(rule[1], 1.2) : 0.3) });
  }
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
// real New York time -> tod (0 = noon .. 1 = midnight, mirrored through the morning)
function nycTod() {
  const p = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "numeric", hour12: false })
    .formatToParts(new Date());
  const h = (+p.find(x => x.type === "hour").value % 24) + (+p.find(x => x.type === "minute").value) / 60;
  return Math.min(1, Math.abs(h - 12) / 12 * 1.15);
}
function nycClock() {
  return new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" }).format(new Date());
}
// the time of day is the game's, not the player's: the real New York clock (the sky, the lights and the crowd all follow it).
// ?time=day|dusk|night|<hour 0-24> pins it for QA, screenshots and (later) missions that want a fixed hour.
const TIME_PIN = (() => { const t = new URLSearchParams(location.search).get("time"); if (!t) return null; const h = { day: 12, dusk: 18.5, night: 23 }[t] ?? +t; return Number.isFinite(h) ? Math.min(1, Math.abs(h - 12) / 12 * 1.15) : null; })();
let live = TIME_PIN == null;
const todNow = () => TIME_PIN ?? nycTod();
let curTod = 0;
function setTime(tod) {
  curTod = tod;
    const night = smooth(0.45, 0.8, tod), dusk = smooth(0.25, 0.55, tod);
  for (const e of emissives) e.m.emissiveIntensity = e.day + (e.night - e.day) * night;
  const sunE = Math.max(0, 1 - smooth(0.35, 0.62, tod));
  sun.intensity = 3.2 * sunE;
  sun.color.setRGB(1, 1 - 0.25 * dusk, 1 - 0.5 * dusk);
  const elev = THREE.MathUtils.degToRad(62 - 103 * Math.min(tod, 0.65));
  sun.position.set(Math.cos(elev) * 600, Math.sin(elev) * 600 + 1, 300);
  hemi.intensity = 0.55 * (1 - night) + 0.08 * night;
  skyMat.uniforms.top.value.setRGB(0.03, 0.16, 0.62).lerp(new THREE.Color(0.012, 0.014, 0.04), night);
  skyMat.uniforms.horizon.value.setRGB(0.42, 0.6, 0.86).lerp(new THREE.Color(0.9, 0.55, 0.35), dusk * (1 - night))
    .lerp(new THREE.Color(0.11, 0.06, 0.12), night);
  scene.environment = night > 0.5 ? (env.night || env.day) : (env.day || null);
  scene.environmentIntensity = 0.9 * (1 - night) + 0.25 * night;
  scene.fog.color.copy(skyMat.uniforms.horizon.value);
  bloom.strength = 0.1 + 0.35 * night;
  if (typeof captureWaterReflection === "function" && waterReflTod >= 0) setTimeout(() => captureWaterReflection(false), 50);   // light changed: re-shoot
  bloom.threshold = 0.98 - 0.13 * night;
}

// ---------------------------------------------------------------- load the district from world.json
const draco = new DRACOLoader().setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/");
const gltf = new GLTFLoader().setDRACOLoader(draco);
const pickables = [];
const perf = { chunks: {} };
const NOOPT = new URLSearchParams(location.search).has("noopt");   // debugging: load the chunks exactly as exported                                  // load-time optimisation stats (see ?debug)
let demoBrands = null, demoOn = true;
const slotMaterials = new Map();  // slot_id -> {material, placeholder}

const HERO_VIEW = { eye: [-14.5, 137.5, 6.4], target: [16, -215, 40] };   // top of the red steps, 1 Times Sq on a third
let resolveCity; const cityReady = new Promise(r => resolveCity = r);
let sceneObstacleVersion = 0;

function loadChunk(path) {
  return new Promise((res, rej) => gltf.load(ROOT + path, g => {
    const st = NOOPT ? {} : optimizeChunk(g.scene);          // few big draws instead of one per building / prop
    perf.chunks[path.split("/").pop()] = st;
    g.scene.traverse(o => {
      if (!o.isMesh) return;
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(registerMaterial);
      let p = o;
      while (p && !p.userData.slot_id) p = p.parent;
      if (p) { pickables.push(o); slotMaterials.set(p.userData.slot_id, { mat: o.material, ph: o.material.emissiveMap }); screens.add(p.userData.slot_id, o.material); }
    });
    scene.add(g.scene);
    sceneObstacleVersion++;
    adoptWater(g.scene);
    res();
  }, undefined, rej));
}

async function load() {
  const world = await (await fetch(ROOT + "config/world.json")).json();
  const district = world.districts.find(d => d.enabled);
  business.salesContact = world.sales_contact;            // set in config/world.json (checked before deploy)
  plan.salesContact = world.sales_contact;
  plan.paymentLink = world.checkout?.payment_link || null;  // e.g. a Stripe Payment Link; without one: invoice requests
  const all = Object.entries(district.files.chunks).filter(([k]) => k !== "collision");
  const FIRST = ["hero", "terrain", "props", "water"];          // what you see from the red steps
  const first = all.filter(([k]) => FIRST.includes(k)), rest = all.filter(([k]) => !FIRST.includes(k));
  const bar = document.querySelector("#bar > div");
  let done = 0;
  const tick = () => { done++; bar.style.width = (100 * done / (first.length + 2)) + "%"; };
  await Promise.all([loadEnv("day", "wide_street_01_2k.hdr").then(tick), loadEnv("night", "shanghai_bund_2k.hdr").then(tick)]);
  await Promise.all(first.map(([, path]) => loadChunk(path).then(tick)));
  try { demoBrands = (await (await fetch(ROOT + "data/times_square/demo_brands.json", { cache: "no-cache" })).json()).hero; } catch (e) {}
  applyDemo(true);
  setTime(todNow());

let qualityOverride = null;

    cityMap.cx += P.lx * 400 * dt / cityMap.s; cityMap.cy -= P.ly * 400 * dt / cityMap.s;
    if (P.r2 > 0.1 || P.l2 > 0.1) cityMap.zoomAt(Math.exp((P.r2 - P.l2) * dt * 2));
    if (P.lx || P.ly) { cityMap.clamp(); cityMap.draw(); }
    if (P.pressed(BTN.CROSS)) cityMap.tap(cityMap.W / 2, cityMap.H / 2);
    if (P.pressed(BTN.CIRCLE) || P.pressed(BTN.TRIANGLE)) cityMap.close();
    return;
  }
  if (P.pressed(BTN.TRIANGLE)) return toggleMap();
  flight.pad = null; helm.pad = null;
  if (helm.active) {
    helm.pad = P;
    if (P.pressed(BTN.UP)) helm.step(1);
    if (P.pressed(BTN.DOWN)) helm.step(-1);
    if (P.pressed(BTN.CROSS)) helm.context();
    if (P.pressed(BTN.SQUARE)) helm.horn();
    if (P.pressed(BTN.R3)) helm.toggleView();
    if (P.pressed(BTN.CIRCLE)) helm.leave();

  }

    flight.pad = P;

    return;
  }

  if (P.pressed(BTN.CROSS) && helm.near) return void helm.board();
  if (ride.inCar) {
    ride.pad = P;
    if (P.pressed(BTN.SQUARE)) ride.honk();
    if (ride.vehicle?.kind === "bike" && P.pressed(BTN.R1)) ride.jumpBike();
    if (P.pressed(BTN.CIRCLE)) ride.getOut();
    if (P.pressed(BTN.R3) && ride.vehicle?.kind === "taxi") ride.action("view");
    if (P.pressed(BTN.CROSS)) ride.panel.querySelector(".ui-btn.primary:not([disabled])")?.click();
    return;
  }
  if (P.pressed(BTN.CROSS)) {                                 // interact: hop in > get in > tap whatever is in the middle of the view
    if (ride.approaching) return void ride.enter(ride.approaching.t);
    if (ride.hopTarget) return void ride.approach(ride.hopTarget);
    if (ride.state === "waiting") return void ride.approach({ booked: true });
    centreTap();
  }
  if (P.pressed(BTN.CIRCLE) && mode === "walk") setMode("orbit");
  if (P.pressed(BTN.R3) || P.pressed(BTN.L3)) setMode(mode === "walk" ? "orbit" : "walk");
  if (P.pressed(BTN.L1)) mode === "walk" && Settings.roughContact ? walk.attack() : nav.turn(Math.PI / 6);
  if (P.pressed(BTN.R1)) nav.turn(-Math.PI / 6);
  if (P.pressed(BTN.UP)) zoomBy(1);
  if (P.pressed(BTN.DOWN)) zoomBy(-1);
  if (P.r2 > 0.15 || P.l2 > 0.15) { pad.zt = (pad.zt || 0) - dt; if (pad.zt < 0) { zoomBy(P.r2 > P.l2 ? 1 : -1); pad.zt = 0.35; } }
  if (mode === "walk") { walk.pad = { ...P, run: P.held(BTN.L3) || P.l2 > 0.5 }; if (P.pressed(BTN.SQUARE)) walk.jump(); }
  else nav.pad = P;
}
// ✕ with nothing nearby: act on whatever is in the centre of the screen (a screen, a car, the ground)
function centreTap() {
  ray.setFromCamera(new THREE.Vector2(0, 0), camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  let p = hit?.object; while (p && !p.userData.slot_id) p = p.parent;
  if (p) return business.onScreen(p.userData.slot_id);
  if (ride.tapCar(ray)) return;
  if (mode === "walk") {
    const g = ray.intersectObjects(scene.children, true).find(h => h.object !== sky && !h.object.userData.crowd && h.point.y < camera.position.y - 0.5);
    if (g) walk.walkTo(g.point);
  }
}

// ---------------------------------------------------------------- minimap (heading-up, baked per district)
// Same symbols as the full map: blue dot + heading cone = you, red pin = destination, red discs = landmarks.
const mm = document.getElementById("minimap"), mx = mm.getContext("2d");
let mapImg = null, mapData = null;
fetch(ROOT + "export/times_square/map.json").then(r => r.json()).then(d => {
  mapData = d; mapImg = new Image(); mapImg.src = ROOT + "export/times_square/map.png";
  fetch(ROOT + "export/harbor/map.json").then(r => r.json()).then(h => {      // the harbour layer, drawn underneath
    harborMap = { ...h, img: new Image() }; harborMap.img.src = ROOT + "export/harbor/map.webp";
    mapData.labels = [...mapData.labels, ...h.labels.filter(l => l.kind !== "island")];
    mapData.markers = [...mapData.markers, ...h.markers];      // harbour landmarks on the minimap too
  }).catch(() => {});
});
let harborMap = null;
const cityMap = new CityMap({ root: ROOT, district: "times_square", camera, nav,
  onGo: p => nav.go(p),                                      // in a car this re-routes it (nav.beforeGo)
  onWalk: p => { if (ride.inCar) ride.getOut(); nav.walkTo(p); },
  canLand: () => flight.state === "air",
  onRide: p => {
    if (ride.inCar) return;
    if (p?.id?.startsWith("bike_")) return ride.rideBike(p.id);
    if (p?.id?.startsWith("vehicle_")) return ride.rideParked(p.id);
    if (p?.id?.startsWith("apt_")) return flight.startLanding(p.id.slice(4));
    if (p?.id === "intrepid") return flight.board({ home: true });
    if (p?.id === "pier83") return helm.board();
    if (ride.state === "coming" || ride.state === "waiting") return ride.setDestination(p);
    return ride.book(p);
  },
  inCar: () => ride.inCar, route: () => tours.mapInfo() || fares.mapInfo() || trip.mapInfo() || ride.mapInfo() || flight.mapInfo(), onDirections: p => trip.open(p),
  getSlot: id => business.sales?.get(id), onScreen: id => business.open(id), region,
  whereAmI: () => {                                          // the blue dot: you, not the camera behind you
    const o = flight.active ? flight.plane.position : helm.active && boat.group ? boat.group.position : mode === "walk" ? walk.eye : null;
    return o ? [o.x, -o.z] : null;
  } });
const toggleMap = () => cityMap.toggle();
ride.onGarageMap = marker => cityMap.focusMarker(marker);
// the parked motorcycles: a live pin on the full map and the minimap (they follow the bike, hide while you ride it)
(function zonesWhenReady() { if (!nav.places?.length || !mapData || !cityMap.data) return setTimeout(zonesWhenReady, 500); addZones(nav, [mapData, cityMap.data]); missions.register(nav); })();
ride.onBikes = list => (function add() {
  if (!mapData || !cityMap.data) return setTimeout(add, 400);
  mapData.markers.push(...list); cityMap.data.markers.push(...list);
})();
ride.onVehicles = list => (function update() {
  if (!mapData || !cityMap.data) return setTimeout(update, 400);
  for (const data of [mapData, cityMap.data]) {
    data.markers = data.markers.filter(m => !m.id?.startsWith("vehicle_"));
    data.markers.push(...list);
  }
})();
let mmHits = [];                                             // screen dots drawn on the minimap (canvas px)
mm.addEventListener("click", e => {                          // tap a yellow screen = preview it; anywhere else = full map
  const r = mm.getBoundingClientRect(), k = mm.width / r.width;
  if (nav.showAds && mmHits.length && r.width >= 120) {     // the tiny phone minimap always opens the big map
    const u = (e.clientX - r.left) * k, v = (e.clientY - r.top) * k;
    let best = null, bd = 16 * k;                            // 16 css px: a comfortable fingertip
    for (const h of mmHits) { const d = Math.hypot(h.u - u, h.v - v); if (d < bd) { bd = d; best = h; } }
    if (best) return business.open(best.id);
  }
  cityMap.open();
});
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "KeyM") toggleMap();
});
function drawMinimap() {
  if (!mapImg || !mapImg.complete || !mapData) return;
  const S = mm.width, k = mapData.px_per_m, [x0, , , y1] = mapData.bounds;
  const you = mode === "walk" ? walk.eye : camera.position;           // walking in third person: you, not the camera
  const px = you.x, py = -you.z;                                      // you, in local metres
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  const heading = Math.atan2(dir.x, -dir.z);                          // 0 = uptown (+Y)
  const zoom = camera.position.y > 80 ? 0.35 : 0.9;                   // screen px per map px
  mx.save(); mx.fillStyle = "#16191e"; mx.fillRect(0, 0, S, S);           // beyond the maps
  mx.translate(S / 2, S / 2); mx.rotate(-heading); mx.scale(zoom, zoom);   // heading-up, like in-car navigation
  const RT = cityMap.regionTiles, RM = region?.map, reach = S / zoom / k * 0.75;
  if (RT) {                                                           // the region's street map tiles around you
    for (const t of RT) {
      const [tx0, ty0, tx1, ty1] = t.bounds;
      if (tx1 < px - reach || tx0 > px + reach || ty1 < py - reach || ty0 > py + reach) continue;
      if (!t.img) { t.img = new Image(); t.img.src = t.url; }
      if (t.img.complete && t.img.naturalWidth) mx.drawImage(t.img, -(px - tx0) * k, -(ty1 - py) * k, (tx1 - tx0) * k, (ty1 - ty0) * k);
    }
  } else if (RM) {                                                    // the wider region (coast, airports): under everything
    const [rx0, , , ry1] = RM.bounds, kr = RM.px_per_m, r = S / zoom / k * 0.75;   // just the patch around you (the
    mx.drawImage(RM.img, (px - r - rx0) * kr, (ry1 - py - r) * kr, 2 * r * kr, 2 * r * kr,     // whole image scaled up
      -r * k, -r * k, 2 * r * k, 2 * r * k);                                                   // is too big to draw)
  }
  if (harborMap?.img.complete) {                                      // harbour layer underneath, in the same pixel units
    const [hx0, , , hy1] = harborMap.bounds, f = k / harborMap.px_per_m;
    mx.drawImage(harborMap.img, -(px - hx0) * k, -(hy1 - py) * k, harborMap.img.width * f, harborMap.img.height * f);
  }
  mx.drawImage(mapImg, -(px - x0) * k, -(y1 - py) * k);
  const P = (x, y) => [(x - px) * k, -(y - py) * k];
  const rideInfo = tours?.mapInfo() || fares?.mapInfo() || trip?.mapInfo() || ride.mapInfo() || flight?.mapInfo();
  if (rideInfo?.route?.length > 1) {                                  // the route still to drive (Google blue)
    mx.beginPath(); rideInfo.route.forEach(([x, y], i) => { const [u, v] = P(x, y); i ? mx.lineTo(u, v) : mx.moveTo(u, v); });
    mx.lineWidth = 9 / zoom; mx.strokeStyle = "#0a84ff"; mx.lineJoin = mx.lineCap = "round"; mx.stroke();
  }
  mx.restore();
  const c = Math.cos(-heading), sn = Math.sin(-heading);
  const place = (x, y) => { const [u, v] = P(x, y); return [S / 2 + (u * c - v * sn) * zoom, S / 2 + (u * sn + v * c) * zoom]; };
  const R = S / 2 - 18;
  mmHits = [];
  // street names: nearest roads first, never overlapping, never over you (skipped when too small to read)
  if (mm.clientWidth >= 150) {
    const fs = 15, taken = [], reach = S * 0.3 / zoom / k;
    mx.textAlign = "center"; mx.textBaseline = "middle"; mx.font = `600 ${fs}px -apple-system, sans-serif`;
    const tryLabel = (text, x, y, color) => {
      const [u, v] = place(x, y), w = mx.measureText(text).width + 10, h = fs + 6;
      if (Math.hypot(u - S / 2, v - S / 2) > R - w / 2 || Math.hypot(u - S / 2, v - S / 2) < 26) return false;
      if (taken.some(t => Math.abs(t[0] - u) < (t[2] + w) / 2 && Math.abs(t[1] - v) < (t[3] + h) / 2)) return false;
      taken.push([u, v, w, h]);
      mx.fillStyle = "rgba(10,12,16,.72)"; mx.beginPath(); mx.roundRect(u - w / 2, v - h / 2, w, h, 5); mx.fill();
      mx.fillStyle = color; mx.fillText(text, u, v + 1);
      return true;
    };
    const cands = [];
    for (const l of mapData.labels) {
      // Midtown's grid names only where that grid is (an avenue's name at the Battery would be wrong)
      const inMid = (q) => q[0] > -1750 && q[0] < 960 && q[1] > Math.max(-720, l.ymin ?? -720) && q[1] < 740;
      if (l.kind === "avenue") { const pts = [[l.x, py + reach * 0.55], [l.x, py - reach * 0.55], [l.x, py]].filter(inMid); if (pts.length) cands.push({ t: l.text, d: Math.abs(l.x - px), pts }); }
      else if (l.kind === "street") { const pts = [[px + reach * 0.5, l.y], [px - reach * 0.5, l.y], [px, l.y]].filter(inMid); if (pts.length) cands.push({ t: l.text, d: Math.abs(l.y - py), pts }); }
      else cands.push({ t: l.text, d: Math.hypot(l.x - px, l.y - py), pts: [[l.x, l.y]], c: l.kind === "road" || l.kind === "area" ? "#e6e8ec" : "#8fc3ff" });
    }
    const bw = mapData.paths?.Broadway;
    if (bw) {
      const pts = [];
      for (let i = 0; i < bw.length - 1; i++) for (let t = 0; t < 1; t += 0.25)
        pts.push([bw[i][0] + (bw[i + 1][0] - bw[i][0]) * t, bw[i][1] + (bw[i + 1][1] - bw[i][1]) * t]);
      pts.sort((a, b) => Math.abs(Math.hypot(a[0] - px, a[1] - py) - reach * 0.5) - Math.abs(Math.hypot(b[0] - px, b[1] - py) - reach * 0.5));
      cands.push({ t: "Broadway", d: Math.min(...pts.map(q => Math.hypot(q[0] - px, q[1] - py))), pts: pts.slice(0, 6), c: "#ffd27a" });
    }
    cands.sort((a, b) => a.d - b.d);
    for (const cnd of cands) for (const q of cnd.pts) if (tryLabel(cnd.t, q[0], q[1], cnd.c || "#e9e9ee")) break;
  }
  // places: the same red pin as the full map, with its symbol (✈ plane, ⚓ boat, ★ landmark). Blue is only ever you.
  for (const m of mapData.markers) {
    if (m.icon === "slot" || m.hidden) continue;
    const [u, v] = place(m.x, m.y);
    if (Math.hypot(u - S / 2, v - S / 2) > R) continue;
    mx.beginPath(); mx.arc(u, v, 10, 0, 7);
    mx.fillStyle = pinColor(m.icon); mx.fill();
    mx.lineWidth = 2.5; mx.strokeStyle = "#fff"; mx.stroke();
    drawPlaceIcon(mx, m.icon, u, v, 10); drawBadge(mx, u, v, 10, m);
  }
  // business view: every sellable screen, tappable (yellow = the business colour everywhere)
  if (nav.showAds) {
    for (const m of mapData.markers) {
      if (m.icon !== "slot") continue;
      const [u, v] = place(m.x, m.y);
      if (Math.hypot(u - S / 2, v - S / 2) > R) continue;
      const hc = Settings.v.contrast;
      mx.beginPath(); mx.arc(u, v, hc ? 11 : 8, 0, 7); mx.fillStyle = "#64d2ff"; mx.fill();
      mx.lineWidth = hc ? 4 : 2.5; mx.strokeStyle = hc ? "#ffffff" : "#1c1c1e"; mx.stroke();
      mmHits.push({ u, v, id: m.id });
    }
  }
  if (rideInfo && !ride.inCar) {                                      // your cab on its way
    const [u, v] = place(...rideInfo.car);
    if (Math.hypot(u - S / 2, v - S / 2) < R) { mx.beginPath(); mx.roundRect(u - 9, v - 9, 18, 18, 5); mx.fillStyle = "#ffcc00"; mx.fill();
      mx.lineWidth = 2.5; mx.strokeStyle = "#1c1c1e"; mx.stroke(); }
  }
  // destination: red pin, clamped to the rim when off-map (points the way)
  if (nav.waypoint) {
    let [wu, wv] = place(nav.waypoint.x, nav.waypoint.y);
    const dx = wu - S / 2, dy = wv - S / 2, dd = Math.hypot(dx, dy), lim = S / 2 - 22;
    if (dd > lim) { wu = S / 2 + dx / dd * lim; wv = S / 2 + dy / dd * lim; }
    mx.save(); mx.translate(wu, wv - 22);
    mx.beginPath(); mx.arc(0, 0, 10, Math.PI * 0.85, Math.PI * 0.15); mx.lineTo(0, 22); mx.closePath();
    mx.fillStyle = "#ff453a"; mx.fill(); mx.beginPath(); mx.arc(0, 0, 3.5, 0, 7); mx.fillStyle = "#7a1712"; mx.fill(); mx.restore();
  }
  // you: blue dot with a heading cone (the map is heading-up, so the cone always points up)
  const g = mx.createRadialGradient(S / 2, S / 2, 4, S / 2, S / 2, 52);
  g.addColorStop(0, "rgba(10,132,255,.55)"); g.addColorStop(1, "rgba(10,132,255,0)");
  mx.beginPath(); mx.moveTo(S / 2, S / 2); mx.arc(S / 2, S / 2, 52, -Math.PI / 2 - 0.5, -Math.PI / 2 + 0.5); mx.closePath();
  mx.fillStyle = g; mx.fill();
  mx.beginPath(); mx.arc(S / 2, S / 2, 10, 0, 7); mx.fillStyle = "#0a84ff"; mx.fill();
  mx.lineWidth = 3.5; mx.strokeStyle = "#fff"; mx.stroke();
  // compass (Apple Maps style): dark disc on the rim at upper right, red needle = true north
  const north = -heading - THREE.MathUtils.degToRad(mapData.grid_rotation_deg || 0);
  const cx = S / 2 + Math.cos(-Math.PI / 4) * (S / 2 - 30), cy = S / 2 + Math.sin(-Math.PI / 4) * (S / 2 - 30);
  mx.beginPath(); mx.arc(cx, cy, 22, 0, 7); mx.fillStyle = "rgba(18,18,24,.92)"; mx.fill();
  mx.lineWidth = 1.5; mx.strokeStyle = "rgba(255,255,255,.25)"; mx.stroke();
  mx.save(); mx.translate(cx, cy); mx.rotate(north);
  mx.beginPath(); mx.moveTo(0, -15); mx.lineTo(5, 0); mx.lineTo(-5, 0); mx.closePath(); mx.fillStyle = "#ff453a"; mx.fill();
  mx.beginPath(); mx.moveTo(0, 15); mx.lineTo(5, 0); mx.lineTo(-5, 0); mx.closePath(); mx.fillStyle = "#d1d1d6"; mx.fill();
  mx.restore();
}

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
let paused = false;
function tick() {
  let dt = Math.min(clock.getDelta(), 0.05);
  if (hitStop > 0) { hitStop -= dt; dt *= 0.06; }               // impact freeze: the world nearly stops for a beat when a punch lands
  handlePad(dt);
  if (paused) { composer.render(); requestAnimationFrame(tick); return; }   // the world holds still behind the menu
  if (mode === "walk") walk.update(dt, document.activeElement?.tagName === "INPUT" ? {} : keys);
  else if (mode === "orbit" && !nav.flight) orbit.update();
  ride.update(dt);
  flight.update(dt);
  region?.update(camera);
  boat.update(dt);
  helm.update(dt);
  intrepid.update();
  trip.update();
  fares.update(dt);
  playzone.update(dt);
  ride.furniture?.update(dt); fx.update(dt, ride); population.update(dt);
  heli.show(!!(pursuit?.active && (pursuit.stars || 0) >= 4), ride); heli.update(dt, ride);
  speedboat.update(dt);
  tours.update(dt);
  traffic?.update(dt);
  pursuit?.update(dt);
  nav.update(dt, keys);
  if (crowd) crowd.update(dt);
  npcs?.update(dt);
  screens.update(dt);
  audio.update(dt);
  business.update(clock.elapsedTime);
  sky.position.copy(camera.position);
  worldWater.position.x = camera.position.x; worldWater.position.z = camera.position.z;   // always reaches the horizon
  const near = camera.position.y > 300 ? 1.0 : camera.position.y > 60 ? 0.4 : 0.1;   // depth precision for a 16 km view
  drawMe(dt);
  if (mode === "walk") walk.applyView(dt);                   // third person: the camera steps back behind you to draw
  if (camera.near !== near) { camera.near = near; camera.updateProjectionMatrix(); }
  composer.render();
  drawMinimap();
  Messages.layout();
  syncDock();
  requestAnimationFrame(tick);
}
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
goTo(HERO_VIEW.eye, HERO_VIEW.target);
tick();
load().catch(err => {                                         // plain words + a way out, never a raw error
  console.error(err);
  const t = document.getElementById("loadtxt");
  t.innerHTML = navigator.onLine ? "Something went wrong loading the city." : "You seem to be offline.";
  t.insertAdjacentHTML("beforeend", ` <button class="ui-btn primary" style="margin-left:8px" onclick="location.reload()">Try again</button>`);
});
